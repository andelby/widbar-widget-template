# Publishes docs/ to the repository wiki whenever it changes on main. The wiki
# is a copy: edit the pages in docs/, never in the wiki itself.
name: Publish docs to the wiki

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docs into the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

          # Mirror docs/: pages removed there disappear from the wiki too.
          find wiki -maxdepth 1 -name '*.md' -delete
          for page in docs/*.md; do
            name=$(basename "$page")
            if [ "$name" = "Home.md" ]; then
              cat "$page"
            else
              # The wiki already shows the page name as the title: drop the H1.
              awk 'NR == 1 && /^# / { drop = 1; next } drop && /^$/ { drop = 0; next } { drop = 0; print }' "$page"
            fi |
              # Wiki links have no .md: (Flyout.md#size) becomes (Flyout#size).
              sed -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' > "wiki/$name"
          done

          cd wiki
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync docs from ${GITHUB_SHA::7}"
          git push
